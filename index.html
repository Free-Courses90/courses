function ad(size){

  const [w,h]=size==="native"?[0,280]:size.split("x").map(Number);

}

  io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target,s=el.dataset.ad;
    const f=document.createElement("iframe");f.title="Advertisement";f.loading="lazy";
    f.setAttribute("sandbox","allow-scripts allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-top-navigation-by-user-activation");

    f.srcdoc='<!doctype html><body style="margin:0">'+ADS[s];el.appendChild(f)}),{rootMargin:"300px"});

}

 seo({path:"/contact",title:L("Contact Us | Free Courses","اتصل بنا | Free Courses"),desc:L("Contact Free Courses to suggest a course, report a broken link or ask a question.","تواصل مع Free Courses لاقتراح كورس أو الإبلاغ عن رابط معطل أو طرح سؤال."),crumbs:[["Home","/"],["Contact","/contact"]]});
 return `<div class="wrap doc"><h1>${L("Contact Us","اتصل بنا")}</h1><p>${L("Suggest a course, report a broken link or ask a question. Your message opens in your email app.","اقترح كورساً أو أبلغ عن رابط معطل أو اطرح سؤالاً. ستُفتح رسالتك في تطبيق البريد لديك.")}</p>
 <form id="cf" class="fl" style="flex-direction:column"><input name="n" required aria-label="${L("Name","الاسم")}" placeholder="${L("Your name","اسمك")}"><input name="s" required aria-label="${L("Subject","الموضوع")}" placeholder="${L("Subject","الموضوع")}"><textarea name="m" required rows="6" aria-label="${L("Message","الرسالة")}" placeholder="${L("Message","الرسالة")}" style="border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:8px;padding:10px;font:inherit"></textarea><button class="btn" type="submit">${L("Send by email","إرسال عبر البريد")}</button></form></div>`;
}
function nf(){
 seo({path:location.pathname.slice(SITE.base.length)||"/",title:L("Page not found | Free Courses","الصفحة غير موجودة | Free Courses"),desc:L("This page or course does not exist.","هذه الصفحة أو الكورس غير موجود."),noindex:true});
 return msg(L("404 - Page not found","404 - الصفحة غير موجودة"),L("The page or course you opened does not exist or was removed.","الصفحة أو الكورس الذي فتحته غير موجود أو تمت إزالته."),lk("/courses",L("Browse all courses","تصفح كل الكورسات"),"btn"));
}

/* ================= ROUTER ================= */
function route(){
 used=new Set();const p=(location.pathname.slice(SITE.base.length)||"/").replace(/\/+$/,"")||"/",seg=p.split("/").filter(Boolean);
 const app=$("#app");let html,rails=false;
 if(LOADERR){html=msg(L("Courses could not be loaded","تعذر تحميل الكورسات"),L("Check that courses.json exists and is valid JSON, then try again.","تأكد من وجود courses.json وأنه JSON صحيح ثم حاول مجدداً."),`<button class="btn" onclick="location.reload()">${L("Try again","إعادة المحاولة")}</button>`)}
 else if(p==="/"){html=home();rails=true}
 else if(p==="/courses"){html=courses();rails=true}
 else if(p==="/categories")html=categories();
 else if(seg[0]==="category"&&seg[1])html=category(decodeURIComponent(seg[1]));
 else if(seg[0]==="course"&&seg[1])html=course(decodeURIComponent(seg[1]));
 else if(["about","privacy","terms","disclaimer"].includes(seg[0])&&seg.length===1)html=doc(seg[0]);
 else if(p==="/contact")html=contact();
 else html=nf();
 app.innerHTML=html;
 $("#rl").innerHTML=rails?ad("160x600"):"";$("#rr").innerHTML=rails?ad("160x300"):"";
 chrome(p);bind(p);mountAds();window.scrollTo(0,0);globalAds();
}
function chrome(p){
 const N=[["/",L("Home","الرئيسية")],["/courses",L("All Courses","الكورسات")],["/categories",L("Categories","التصنيفات")],["/about",L("About","من نحن")],["/contact",L("Contact","اتصل بنا")]];
 $("#nav").innerHTML=N.map(n=>`<a href="${U(n[0])}" data-r class="${p===n[0]?"on":""}">${n[1]}</a>`).join("");
 $("#lg").innerHTML=ic("lang")+(lang==="ar"?"English":"العربية");$("#mb").innerHTML=ic("menu");
 $("#th").innerHTML=ic(document.documentElement.dataset.theme==="dark"?"sun":"moon");
 const sp=lk("/privacy",L("Privacy Policy","سياسة الخصوصية")),
 f=`<div class="fg"><div><div class="logo" style="color:var(--ink)"><b>${ic("book")}</b>Free Courses</div><p>${L("A curated directory of free online courses. We link to original providers and do not host course files.","دليل منتقى لكورسات مجانية على الإنترنت. نربط بالجهات الأصلية ولا نستضيف ملفات الكورسات.")}</p></div>
 <div><h4>${L("Explore","استكشف")}</h4>${lk("/courses",L("All Courses","كل الكورسات"))}${lk("/categories",L("Categories","التصنيفات"))}</div>
 <div><h4>${L("Company","الموقع")}</h4>${lk("/about",L("About Us","من نحن"))}${lk("/contact",L("Contact Us","اتصل بنا"))}${sp}${lk("/terms",L("Terms of Use","شروط الاستخدام"))}${lk("/disclaimer",L("Disclaimer","إخلاء المسؤولية"))}</div></div>
 <div class="cp"><span>&copy; ${new Date().getFullYear()} Free Courses</span><a href="${A4}" target="_blank" rel="sponsored nofollow noopener">${L("Sponsored link","رابط برعاية")}</a></div>`;
 $("#ft").innerHTML=f;$("#nav").classList.remove("open");
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
}
function bind(p){
 const hs=$("#hs");if(hs)hs.onsubmit=e=>{e.preventDefault();F={q:hs.q.value,cat:"",level:"",lang:"",sort:"new"};go("/courses")};
 if(p==="/courses"){
  const q=new URLSearchParams(location.search);if(q.get("q")&&!F.q){F.q=q.get("q");$("#fq").value=F.q}
  let t;$("#fq").oninput=e=>{clearTimeout(t);t=setTimeout(()=>{F.q=e.target.value;shown=PAGE;results()},150)};
  [["fc","cat"],["fv","level"],["fl","lang"],["fs","sort"]].forEach(([i,k])=>$("#"+i).onchange=e=>{F[k]=e.target.value;shown=PAGE;results()});
  results();
 }
 const cf=$("#cf");if(cf)cf.onsubmit=e=>{e.preventDefault();location.href=`mailto:${SITE.email}?subject=${encodeURIComponent(cf.s.value)}&body=${encodeURIComponent(cf.m.value+"\n\n"+cf.n.value)}`};
}
function go(p){history.pushState(null,"",U(p));shown=PAGE;route()}
document.addEventListener("click",e=>{const a=e.target.closest("a[data-r]");if(!a||e.ctrlKey||e.metaKey||e.shiftKey||e.button)return;e.preventDefault();history.pushState(null,"",a.getAttribute("href"));shown=PAGE;route()});
addEventListener("popstate",route);
$("#lg").onclick=()=>{lang=lang==="ar"?"en":"ar";localStorage.setItem("fc-lang",lang);route()};
$("#th").onclick=()=>{const d=document.documentElement,n=d.dataset.theme==="dark"?"light":"dark";d.dataset.theme=n;localStorage.setItem("fc-theme",n);$("#th").innerHTML=ic(n==="dark"?"sun":"moon")};
$("#mb").onclick=()=>$("#nav").classList.toggle("open");
{const t=localStorage.getItem("fc-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}

/* ================= BOOT ================= */
if(location.search.startsWith("?/")){ // restore path after 404.html redirect (GitHub Pages)
 const r=location.search.slice(2).split("&~&").join("&");history.replaceState(null,"",SITE.base+"/"+r.replace(/^\//,"")+location.hash)}
if(SITE.gsc){const m=document.createElement("meta");m.name="google-site-verification";m.content=SITE.gsc;document.head.appendChild(m)}
if(SITE.ga)addEventListener("load",()=>{const s=document.createElement("script");s.async=1;s.src="https://www.googletagmanager.com/gtag/js?id="+SITE.ga;document.head.appendChild(s);window.dataLayer=[];window.gtag=function(){dataLayer.push(arguments)};gtag("js",new Date());gtag("config",SITE.ga)});
$("#app").innerHTML='<div class="wrap"><div class="grid" style="padding:40px 0">'+'<div class="skel"></div>'.repeat(3)+'</div></div>';
fetch(SITE.base+"/courses.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
 if(!Array.isArray(d))throw 0;
 COURSES=d.filter(c=>c&&c.title&&c.courseUrl).map(c=>{c.slug=c.slug||slugify(c.title);c.image=c.image||"";c.language=c.language||"English";c.level=c.level||"Beginner";c.category=c.category||"IT & Technology";c.platform=c.platform||"";c.duration=c.duration||"";c.date=c.date||"";
  c._s=[c.title,c.titleAr,c.description,c.instructor,c.platform,c.category,(c.keywords||[]).join(" ")].join(" ").toLowerCase();return c});
}).catch(()=>{LOADERR=true}).finally(route);
</script>
</body>
</html>

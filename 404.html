<!DOCTYPE html><html><head><meta charset="utf-8"><title>Free Courses</title><meta name="robots" content="noindex">
<script>
// GitHub Pages has no server routing: send /course/x to /?/course/x, where index.html restores the clean URL.
var keep=0; // number of path segments to keep: 0 for user/custom domain sites, 1 for project pages (/repo-name)
var l=location,s=l.pathname.split("/").slice(0,1+keep).join("/");
l.replace(l.protocol+"//"+l.host+s+"/?/"+l.pathname.slice(1).split("/").slice(keep).join("/").replace(/&/g,"&~&")+(l.search?"&"+l.search.slice(1).replace(/&/g,"&~&"):"")+l.hash);
</script></head><body><a href="/">Free Courses</a></body></html>
